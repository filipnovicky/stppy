# Environment that reproduces the paper's numbers bit for bit (linux-64).
# The exact builds matter: with the same versions from pip (OpenBLAS instead of MKL) the
# preprocessing differs in the last bits and detection finds 5107 instead of 5108 avalanches.
#
#   conda env create -f environment.yml
#   conda activate stppy-paper
#   pip install -e .
name: stppy-paper
channels:
  - defaults
dependencies:
  - python=3.11.13=h1a3bd86_0
  - numpy=2.0.1=py311h08b1b3b_1
  - numpy-base=2.0.1=py311hf175353_1
  - mkl=2023.1.0=h213fc3f_46344
  - mkl-service=2.4.0=py311h5eee18b_2
  - mkl_fft=1.3.11=py311h5eee18b_0
  - mkl_random=1.2.8=py311ha02d727_0
  - intel-openmp=2023.0.0=h9e868ea_25371
  - matplotlib=3.10.6=py311h06a4308_0
  - pip
  - pip:
      - scipy==1.16.0
      - mne==1.10.1
      - scikit-learn==1.7.2
      - pandas==2.3.2
      - statsmodels==0.14.6
      - opencv-python==4.13.0.92
      - h5py==3.15.1
      - nbclient==0.10.2
      - nbformat==5.10.4
      - ipykernel==6.30.1
      - pytest
