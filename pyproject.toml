[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "stppy"
version = "1.0.0"
description = "Spatiotemporal Pattern Processing for Python - EEG avalanche analysis"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Filip Novicky", email = "novicky@cs.cas.cz"}
]
keywords = ["eeg", "neuroscience", "avalanches", "dtw", "clustering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
]

dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    "mne>=1.0.0",
    "scikit-learn>=1.0.0",
    "opencv-python>=4.5.0",
    "POT>=0.9.0",
    "dtw-python>=1.3.0",
    "h5py>=3.0.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/filipnovicky/stppy"
Documentation = "https://github.com/filipnovicky/stppy/blob/main/README.md"
Repository = "https://github.com/filipnovicky/stppy.git"
